<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product review | WDD131</title>
    <meta name="description" content="This is a Form about a product review">
    <meta name="author" content="Camilo Valdivieso">
    <!--CSS folder-->
    <link rel="stylesheet" href="styles/form.css">
    <!--JavaScript  links-->
    <script src="scripts/form.js" defer></script>
    <!--font links-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Macondo&family=Roboto:ital,wght@0,100..900;1,100..900&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

<body>

    <main>
        <div class="form-header">Product Review</div>
        <form method="get" action="form.html" class="wf1">
            <!-- Form fields would go here -->
            <!-- Product Name -->
            <label for="product-name">Product Name</label>
            <select id="product-name" name="productName" required>
                <option value="" disabled selected>Choose a Product...</option>
                <!-- options generated by JS go here -->
            </select>

            <!-- Overall Rating -->
            <fieldset class="rating-fieldset">
                <legend>Overall Rating</legend>
                <div class="rating-group">
                    <label class="rating-label">
                        <span>☆</span>
                        <input type="radio" id="rating1" name="overallRating" value="1" required>
                    </label>
                    <label class="rating-label">
                        <span>☆☆</span>
                        <input type="radio" id="rating2" name="overallRating" value="2" required>
                    </label>
                    <label class="rating-label">
                        <span>☆☆☆</span>
                        <input type="radio" id="rating3" name="overallRating" value="3" required>
                    </label>
                    <label class="rating-label">
                        <span>☆☆☆☆</span>
                        <input type="radio" id="rating4" name="overallRating" value="4" required>
                    </label>
                    <label class="rating-label">
                        <span>☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="overallRating" value="5" required>
                    </label>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <label for="install-date">Date of Installation</label>
            <input type="date" id="install-date" name="installDate" required>

            <!-- Checklist -->
            <fieldset class="features-fieldset">
                <legend>Which features did you find useful in the product? <br><small>(Check all that apply)</small>
                </legend>

                <label class="checkbox-label">
                    <input type="checkbox" id="feature-durability" name="features" value="durability">
                    Durability
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                    Ease of Use
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" id="feature-performance" name="features" value="performance">
                    Performance
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" id="feature-design" name="features" value="design">
                    Design
                </label>
            </fieldset>

            <!-- Written Review (Optional) -->
            <label for="written-review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="written-review" name="writtenReview" rows="4"></textarea>

            <!-- Your Name (Optional) -->
            <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="user-name" name="userName">

            <!-- Submit Button -->
            <input type="submit" value="Post Review" class="submit-btn">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> <span class="footer-divider">Camilo Valdivieso</span> <span
                class="footer-divider">Utah</span></p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
