<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utah outdoor activities</title>
    <meta name="description"
        content="This website provides information about outdoor activities in Utah. It includes details about various recreational opportunities available in the state.">
    <meta name="author" content="Camilo Valdivieso">
    <!--CSS folder-->
    <link rel="stylesheet" href="styles/siteplan.css">
    <!--JavaScript  links-->
    <script src="scripts/siteplan.js" defer></script>
    <!--font  links-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Macondo&family=Roboto:ital,wght@0,100..900;1,100..900&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Macondo&family=Roboto:ital,wght@0,100..900;1,100..900&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <button id="menuButton" aria-label="Toggle Menu">&#9776;</button>
        <nav id="primaryNav">
            <ul>
                <li><a href="siteplan.html">Home</a></li>
                <li><a href="adventures.html">Adventures</a></li>
                <li><a href="contact.html" class="active">Book a Trip</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>Adventure Booking Request</h2>
            <p>Fill out the form below and save your layout preferences locally.</p>

            <form id="bookingForm" action="#" method="get">
                <fieldset>
                    <legend>Contact Information</legend>
                    <label>Full Name *
                        <input type="text" id="fullName" name="fullName" required placeholder="Camilo Chinchilla">
                    </label>
                    <label>Email Address *
                        <input type="email" id="email" name="email" required placeholder="username@example.com">
                    </label>
                    <label>Phone Number *
                        <input type="tel" id="phone" name="phone" required placeholder="(123)1234567">
                    </label>
                </fieldset>

                <fieldset>
                    <legend>Trip Preferences</legend>
                    <label>Adventure Package
                        <select id="packageSelect" name="package">
                            <option value="moab">Moab Sunset Exploration</option>
                            <option value="zion">Zion Backcountry Trekking</option>
                            <option value="wasatch">Wasatch Alpine Climbing</option>
                        </select>
                    </label>
                    <label>Special Instructions
                        <textarea id="comments" name="comments" rows="4"
                            placeholder="Any dietary needs or gear requests?"></textarea>
                    </label>
                </fieldset>

                <button type="submit" class="submit-btn">Submit Booking Request</button>
            </form>

            <!-- Dynamic LocalStorage Response Box -->
            <div id="formResponse" class="response-hidden"></div>
        </section>
    </main>

    <footer>
        <p>
            <span class="footer-divider">&copy; <span id="currentyear"></span></span>
            <span class="footer-divider">Camilo Valdivieso</span>
            <span>Utah</span>
        </p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
